name: Update housing construction cache
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
  push:
    paths:
      - scripts/update-housing-cache.mjs
      - .github/workflows/update-housing-cache.yml
      - data/fa25-housing.json
permissions:
  contents: write
concurrency:
  group: housing-cache
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-housing-cache.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bostadsbyggande.json
          git diff --cached --quiet || (git commit -m "Update housing construction cache" && git push)
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
