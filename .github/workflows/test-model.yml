name: Test model changes

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-model.yml"
      - "data/model_maturity_policy.json"
  pull_request:
    paths:
      - "js/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-model.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Test fading policy
        run: python tests/test_fading.py

      - name: Test SCB request batching
        run: python tests/test_scb_extract.py

      - name: Test migration risk profiles
        run: python tests/test_migration_risk.py

      - name: Test exposure denominator sources
        run: python tests/test_exposure_sources.py

      - name: Test rolling-origin configuration
        run: python tests/test_rolling_backtest_config.py

      - name: Test external FA reference configuration
        run: python tests/test_reference_fa_config.py

      - name: Test component-flow holdout configuration
        run: python tests/test_component_flow_holdout_config.py

      - name: Test SCB consistency support configuration
        run: python tests/test_scb_consistency_config.py

      - name: Test SCB consistency wide parser
        run: python tests/test_scb_consistency_parser.py

      - name: Test mass-preserving SCB consistency adjustment
        run: python tests/test_scb_consistency_adjustment.py

      - name: Test migration analogue candidate pool
        run: python tests/test_migration_analog_config.py

      - name: Validate industrial workforce scenario presets
        run: python scripts/validate_industrial_workforce_scenario.py

      - name: Validate JavaScript syntax
        run: |
          node --check js/model.js
          node --check js/app.js
          node --check scripts/run_reference_fa_backtest.js
          node --check scripts/run_rolling_backtest.js
          node --check scripts/run_component_flow_holdout.js

      - name: Run model tests
        run: node tests/test_model.js

      - name: Build migration analogue similarity diagnostic
        run: python scripts/build_migration_analog_similarity.py

      - name: Build mass-preserving municipality-county adjustment diagnostic
        run: python scripts/build_scb_consistency_adjustment.py

      - name: Validate consistency adjustment on frozen SCB vintages
        run: python scripts/build_scb_consistency_vintage_validation.py

      - name: Build model maturity report
        run: python scripts/build_model_maturity.py

      - name: Build and score historical migration candidate
        run: |
          if [ -f data/raw/mean_population_event_age_pre2025.csv ]; then
            python scripts/build_backtest_2022.py
            node scripts/run_backtest.js
          else
            echo "Event-age mean-population raw file is generated by the full SCB workflow; source/config tests cover this PR."
          fi
