name: Update FA25 housing geography
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update-fa25-housing.py
      - .github/workflows/update-fa25-housing.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/update-fa25-housing.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/fa25-housing.json
          git diff --cached --quiet || (git commit -m "Update verified FA25 housing geography" && git push)
