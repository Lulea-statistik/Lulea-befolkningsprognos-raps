name: Update SCB data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

jobs:
  update-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Test fading policy
        run: python tests/test_fading.py

      - name: Test SCB request batching
        run: python tests/test_scb_extract.py

      - name: Discover current SCB PxWeb tables
        run: python scripts/scb_v2_client.py --out data/scb_discovery.json

      - name: Download selected SCB raw data
        run: python scripts/scb_extract.py

      - name: Build calibrated model data
        run: python scripts/build_model_data.py

      - name: Build labour-market and commuting analysis
        run: python scripts/build_labour_market.py

      - name: Build household and housing analysis
        run: python scripts/build_housing_households.py

      - name: Validate dashboard JavaScript syntax
        run: |
          node --check js/model.js
          node --check js/app.js

      - name: Run model tests
        run: node tests/test_model.js

      - name: Build model validation report
        run: node scripts/validate_model.js

      - name: Build 2022-2024 historical backtest inputs
        run: python scripts/build_backtest_2022.py

      - name: Run and score historical backtest
        run: node scripts/run_backtest.js

      - name: Normalize SCB regional benchmark
        run: python scripts/prepare_scb_benchmark.py

      - name: Compare model with SCB regional benchmark
        run: node scripts/compare_scb_benchmark.js

      - name: Commit changed SCB and model data
        shell: bash
        run: |
          git add data/scb_discovery.json data/raw data/model_data.json data/model_data.js data/model_validation.json data/model_validation.js data/labour_market.json data/labour_market.js data/housing_households.json data/housing_households.js data/backtests data/benchmarks
          if git diff --cached --quiet; then
            echo "No SCB/model data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SCB data and calibrated model inputs"
          git push
