name: Update SCB data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rebuild mode"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

concurrency:
  group: update-scb-data-main
  cancel-in-progress: false

jobs:
  update-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Test fading policy
        run: python tests/test_fading.py

      - name: Test SCB request batching
        run: python tests/test_scb_extract.py

      - name: Test migration risk profiles
        run: python tests/test_migration_risk.py

      - name: Test exposure denominator sources
        run: python tests/test_exposure_sources.py

      - name: Test rolling-origin configuration
        run: python tests/test_rolling_backtest_config.py

      - name: Test external FA reference configuration
        run: python tests/test_reference_fa_config.py

      - name: Test component-flow holdout configuration
        run: python tests/test_component_flow_holdout_config.py

      - name: Test SCB consistency support configuration
        run: python tests/test_scb_consistency_config.py

      - name: Test SCB consistency wide parser
        run: python tests/test_scb_consistency_parser.py

      - name: Test mass-preserving SCB consistency adjustment
        run: python tests/test_scb_consistency_adjustment.py

      - name: Test migration analogue candidate pool
        run: python tests/test_migration_analog_config.py

      - name: Discover current SCB PxWeb tables
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'full' }}
        run: python scripts/scb_v2_client.py --out data/scb_discovery.json

      - name: Download selected SCB raw data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'full' }}
        run: python scripts/scb_extract.py

      - name: Reuse committed SCB source files
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'full' }}
        run: |
          echo "FAST rebuild: using committed data/raw SCB extracts without network refresh."

      - name: Build calibrated model data
        run: python scripts/build_model_data.py

      - name: Build labour-market and commuting analysis
        run: python scripts/build_labour_market.py

      - name: Build household and housing analysis
        run: python scripts/build_housing_households.py

      - name: Validate JavaScript syntax
        run: |
          node --check js/model.js
          node --check js/app.js
          node --check scripts/run_rolling_backtest.js
          node --check scripts/run_reference_fa_backtest.js
          node --check scripts/run_component_flow_holdout.js

      - name: Run model tests
        run: node tests/test_model.js

      - name: Build model validation report
        run: node scripts/validate_model.js

      - name: Build 2022-2024 historical backtest inputs
        run: python scripts/build_backtest_2022.py

      - name: Run and score historical backtest
        run: node scripts/run_backtest.js

      - name: Build rolling-origin historical validation
        run: python scripts/build_rolling_backtest.py

      - name: Run and score rolling-origin validation
        run: node scripts/run_rolling_backtest.js

      - name: Build external FA reference validation
        run: python scripts/build_reference_fa_backtest.py

      - name: Run external FA reference validation
        run: node scripts/run_reference_fa_backtest.js

      - name: Build external migration-component validation
        run: python scripts/build_migration_component_validation.py

      - name: Build adaptive migration recency diagnostic
        run: python scripts/build_migration_recency_diagnostic.py

      - name: Build migration analogue similarity diagnostic
        run: python scripts/build_migration_analog_similarity.py

      - name: Build locked component-flow holdout inputs
        run: python scripts/build_component_flow_holdout.py

      - name: Run locked component-flow holdout validation
        run: node scripts/run_component_flow_holdout.js

      - name: Remove transient component-flow work files
        run: rm -rf data/backtests/component_flow_holdout_work

      - name: Normalize SCB regional benchmark
        run: python scripts/prepare_scb_benchmark.py

      - name: Compare model with SCB regional benchmark
        run: node scripts/compare_scb_benchmark.js

      - name: Build historical official SCB regional-vintage benchmark
        run: python scripts/build_scb_regional_vintage_benchmark.py

      - name: Build SCB municipality-county consistency diagnostic
        run: python scripts/build_scb_consistency_diagnostic.py

      - name: Build mass-preserving municipality-county adjustment diagnostic
        run: python scripts/build_scb_consistency_adjustment.py

      - name: Validate consistency adjustment on frozen SCB vintages
        run: python scripts/build_scb_consistency_vintage_validation.py

      - name: Validate industrial workforce scenario presets
        run: python scripts/validate_industrial_workforce_scenario.py

      - name: Regression-test industrial workforce scenario engine
        run: node scripts/validate_industrial_workforce_scenario.js

      - name: Regression-test housing scenario engine
        run: node scripts/validate_housing_scenario.js

      - name: Validate household projection
        run: python scripts/validate_household_projection.py

      - name: Validate household trend on external holdouts
        run: python scripts/validate_household_projection_external.py

      - name: Validate labour market support layer
        run: python scripts/validate_labour_market_support.py

      - name: Validate production fading policy
        run: python scripts/validate_fading_policy.py

      - name: Validate neutral qutb production mode
        run: node scripts/validate_qutb_neutralization.js

      - name: Validate 2025 CKM base-population bridge
        run: python scripts/validate_base_population_bridge.py

      - name: Validate production sex ratio at birth
        run: node scripts/validate_sex_ratio_at_birth.js

      - name: Validate production FA additivity
        run: node scripts/validate_fa_additivity.js

      - name: Build model maturity report
        run: python scripts/build_model_maturity.py

      - name: Commit changed SCB and model data
        shell: bash
        run: |
          git add data/scb_discovery.json data/raw data/model_data.json data/model_data.js data/model_validation.json data/model_validation.js data/model_maturity.json data/model_maturity.js data/labour_market.json data/labour_market.js data/housing_households.json data/housing_households.js data/backtests data/benchmarks
          if git diff --cached --quiet; then
            echo "No SCB/model data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SCB data and calibrated model inputs"

          # Avoid non-fast-forward failures and, more importantly, avoid
          # publishing generated files built from stale source code.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            if git diff --quiet origin/main HEAD -- data/scb_discovery.json data/raw data/model_data.json data/model_data.js data/model_validation.json data/model_validation.js data/labour_market.json data/labour_market.js data/housing_households.json data/housing_households.js data/backtests data/benchmarks; then
              echo "Remote main advanced, but generated data are already equivalent. Nothing to push."
              exit 0
            fi
            echo "::error::main changed while this workflow was running and generated outputs differ. Re-run Update SCB data on the latest main."
            exit 1
          fi
          git push
