name: Update SCB data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover current SCB PxWeb tables
        run: python scripts/scb_v2_client.py --out data/scb_discovery.json

      - name: Download selected SCB raw data
        run: python scripts/scb_extract.py

      - name: Run model tests
        run: node tests/test_model.js

      - name: Commit changed SCB data
        shell: bash
        run: |
          git add data/scb_discovery.json data/raw
          if git diff --cached --quiet; then
            echo "No SCB data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SCB source metadata and raw data"
          git push
